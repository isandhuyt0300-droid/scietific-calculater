<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Scientific Calculator</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --button-bg: #333;
      --text-color: #fff;
      --accent: #00bcd4;
      --operator: #ff9800;
      --equals: #43a047;
      --danger: #e53935;
    }

    [data-theme="light"] {
      --bg: #f4f4f4;
      --button-bg: #ddd;
      --text-color: #000;
      --accent: #007acc;
      --operator: #f57c00;
      --equals: #388e3c;
      --danger: #d32f2f;
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--text-color);
    }

    .calculator {
      background: var(--bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 360px;
      padding: 25px;
      border: 1px solid var(--accent);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .mode-toggle {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .display {
      background: #000;
      color: #00ff88;
      font-size: 1.8em;
      text-align: right;
      border-radius: 10px;
      padding: 15px;
      overflow-x: auto;
      margin-bottom: 20px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 1em;
      cursor: pointer;
      background: var(--button-bg);
      color: var(--text-color);
      transition: transform 0.1s ease, background 0.2s;
    }

    button:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.05);
    }

    .operator {
      background: var(--operator);
    }

    .equals {
      background: var(--equals);
      grid-column: span 2;
    }

    .clear {
      background: var(--danger);
    }

    .function {
      background: var(--accent);
    }

    @media (max-width: 400px) {
      .calculator {
        width: 90%;
      }
      .display {
        font-size: 1.4em;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="calculator">
    <div class="top-bar">
      <h3>Scientific Calculator</h3>
      <button class="mode-toggle" onclick="toggleMode()">☀️ / 🌙</button>
    </div>

    <div id="display" class="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteChar()">DEL</button>
      <button onclick="append('(')">(</button>
      <button onclick="append(')')">)</button>
      <button class="operator" onclick="append('/')">÷</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('*')">×</button>
      <button class="function" onclick="append('Math.sin(')">sin</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('-')">−</button>
      <button class="function" onclick="append('Math.cos(')">cos</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="operator" onclick="append('+')">+</button>
      <button class="function" onclick="append('Math.tan(')">tan</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
      <button class="function" onclick="append('Math.PI')">π</button>
      <button class="function" onclick="append('Math.E')">e</button>

      <button class="function" onclick="append('Math.sqrt(')">√</button>
      <button class="function" onclick="append('Math.pow(')">xʸ</button>
      <button class="function" onclick="append('Math.log10(')">log</button>
      <button class="function" onclick="append('Math.exp(')">exp</button>
      <button class="function" onclick="append('Math.abs(')">|x|</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const body = document.body;

    function append(value) {
      if (display.innerText === "0") display.innerText = "";
      display.innerText += value;
    }

    function clearDisplay() {
      display.innerText = "0";
    }

    function deleteChar() {
      display.innerText = display.innerText.slice(0, -1) || "0";
    }

    function calculate() {
      try {
        const expression = display.innerText
          .replace(/÷/g, "/")
          .replace(/×/g, "*");
        const result = eval(expression);
        display.innerText = result !== undefined ? result : "Error";
      } catch {
        display.innerText = "Error";
      }
    }

    function toggleMode() {
      const theme = body.getAttribute("data-theme");
      body.setAttribute("data-theme", theme === "dark" ? "light" : "dark");
    }

    // Keyboard input support
    document.addEventListener("keydown", (event) => {
      const key = event.key;
      if (/[0-9+\-*/().]/.test(key)) append(key);
      else if (key === "Enter") calculate();
      else if (key === "Backspace") deleteChar();
      else if (key === "Escape") clearDisplay();
    });
  </script>
</body>
</html>
